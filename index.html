<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Controle PTU</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      background: #1e1e24; 
      color: #fff; 
      margin: 0; 
      padding: 15px;
      /* Restrições de seleção de texto */
      -webkit-user-select: none; /* Safari, Chrome, Opera, iOS */
      -ms-user-select: none;     /* Edge, IE 10+ */
      user-select: none;         /* Padrão W3C */
    }
    h2 { text-align: center; color: #00adb5; margin-bottom: 20px; }
    .container { max-width: 600px; margin: 0 auto; }
    .card { background: #2a2a32; padding: 15px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .card-title { font-weight: bold; color: #00adb5; border-bottom: 1px solid #444; padding-bottom: 5px; margin-bottom: 10px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .telemetry { font-size: 1.2em; background: #18181c; padding: 10px; border-radius: 4px; text-align: center; }
    .telemetry span { color: #ffe600; font-weight: bold; font-size: 1.3em; }
    .telemetry small { display: block; font-size: 0.7em; color: #aaa; margin-top: 5px; font-weight: normal; }
    .telemetry small span { color: #aaa; font-size: 1em; }
    label { font-size: 0.9em; display: block; margin-top: 8px; }
    input[type=number] { width: 100%; padding: 8px; box-sizing: border-box; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; }
    button { width: 100%; padding: 10px; margin-top: 8px; background: #00adb5; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    button:active { background: #008b91; }
    button.btn-danger { background: #ff2e63; }
    button.btn-warning { background: #f08a5d; }
    .jog-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Controle PTU (ESP32)</h2>

    <div class="card">
      <div class="card-title">Telemetria dos Eixos</div>
      <div class="grid">
        <div class="telemetry">
          PAN Eixo: <span id="pan_eixo">0.0</span>°
          <small>Enc Bruto: <span id="pan_real">0.0</span>°</small>
          <small>Vel Real: <span id="pan_vel">0.0</span>°/s</small>
        </div>
        <div class="telemetry">
          TILT Eixo: <span id="tilt_eixo">0.0</span>°
          <small>Enc Bruto: <span id="tilt_real">0.0</span>°</small>
          <small>Vel Real: <span id="tilt_vel">0.0</span>°/s</small>
        </div>
      </div>
      <div class="grid" style="margin-top: 10px;">
        <button class="btn-warning" onclick="sendReq('/zero?eixo=pan')">Zerar Eixo PAN</button>
        <button class="btn-warning" onclick="sendReq('/zero?eixo=tilt')">Zerar Eixo TILT</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Velocidade Base (°/s)</div>
      <div class="grid">
        <div><label>PAN Vel (°/s):</label><input type="number" id="v_pan" value="30"></div>
        <div><label>TILT Vel (°/s):</label><input type="number" id="v_tilt" value="20"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Controle por Posição (Ângulo do Eixo)</div>
      <div class="grid">
        <div><label>PAN Alvo (°):</label><input type="number" id="pos_pan" value="0"></div>
        <div><label>TILT Alvo (°):</label><input type="number" id="pos_tilt" value="0"></div>
      </div>
      <button onclick="moverPosicao()">Enviar Posição</button>
    </div>

    <div class="card">
      <div class="card-title">Controle por Velocidade (Jogging)</div>
      <div class="jog-grid">
        <div></div><button onmousedown="jog('tilt', 1)" onmouseup="parar()" ontouchstart="jog('tilt', 1)" ontouchend="parar()">TILT Up ▲</button><div></div>
        <button onmousedown="jog('pan', -1)" onmouseup="parar()" ontouchstart="jog('pan', -1)" ontouchend="parar()">PAN Left ◄</button>
        <button class="btn-danger" onclick="parar()">PARAR</button>
        <button onmousedown="jog('pan', 1)" onmouseup="parar()" ontouchstart="jog('pan', 1)" ontouchend="parar()">PAN Right ►</button>
        <div></div><button onmousedown="jog('tilt', -1)" onmouseup="parar()" ontouchstart="jog('tilt', -1)" ontouchend="parar()">TILT Down ▼</button><div></div>
      </div>
    </div>
  </div>

  <script>
    function sendReq(url) { fetch(url).catch(err => console.error(err)); }
    function parar() { sendReq('/stop'); }
    
    function moverPosicao() {
      let vp = document.getElementById('v_pan').value;
      let vt = document.getElementById('v_tilt').value;
      let pp = document.getElementById('pos_pan').value;
      let pt = document.getElementById('pos_tilt').value;
      sendReq(`/mover?pp=${pp}&pt=${pt}&vp=${vp}&vt=${vt}`);
    }

    function jog(eixo, dir) {
      let vel = (eixo === 'pan') ? document.getElementById('v_pan').value : document.getElementById('v_tilt').value;
      sendReq(`/jog?eixo=${eixo}&vel=${vel * dir}`);
    }

    setInterval(() => {
      fetch('/status')
        .then(res => res.json())
        .then(data => {
          document.getElementById('pan_eixo').innerText = data.pan_eixo.toFixed(1);
          document.getElementById('tilt_eixo').innerText = data.tilt_eixo.toFixed(1);
          
          document.getElementById('pan_real').innerText = data.pan_real.toFixed(1);
          document.getElementById('tilt_real').innerText = data.tilt_real.toFixed(1);

          // Atualização dos novos campos de velocidade
          document.getElementById('pan_vel').innerText = data.pan_vel.toFixed(1);
          document.getElementById('tilt_vel').innerText = data.tilt_vel.toFixed(1);
        }).catch(err => {});
    }, 200);
  </script> 
</body>
</html>
